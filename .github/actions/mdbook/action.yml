name: mdBook
description: >
  Install the pinned mdBook and build the book. The site lands in
  docs/book/html and the wiki's pages in docs/book/markdown, one renderer
  each, as docs/book.toml declares them.

runs:
  using: composite
  steps:
    - name: Install mdBook
      shell: bash
      env:
        MDBOOK_VERSION: v0.4.40
      run: |
        curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C /usr/local/bin
    - name: Build the book
      shell: bash
      run: mdbook build docs
