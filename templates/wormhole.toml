# Written by `wormhole init`. The whole recipe for this workspace's box.
#
# Every key is explained in the manifest reference:
# https://naborka.github.io/wormhole/guide/manifest.html

version = 1

[image]
# The rootfs this box is built from, verified against its digest before
# anything is extracted. Change either and the next start rebuilds.
base = "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.2-x86_64.tar.gz"
base_sha256 = "412454ed98025ad9cd910d13f3d448b184e81502baa83180e89f98d0f13674be"
package_sources = [
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/main",
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/community",
]
packages = ["bash", "nodejs", "npm", "git", "ca-certificates"]
# Arbitrary shell, run on your machine while the image is built. This is
# the part `wormhole role show` puts in front of you before you trust
# somebody else's role.
build = ["npm install -g @anthropic-ai/claude-code"]

# Anything this build fetches for itself can be named here instead, and
# then wormhole fetches it on the host and checks its digest before the
# build box starts. The box opens no connection for it, so a network that
# intercepts TLS cannot break the build — and the version stops floating
# under a digest that says two images are the same.
#
# These tables belong after every plain key above: TOML reads `build` or
# `packages` written below one of them as part of *its* table.
#
# [[image.artifact]]
# url = "https://example.test/tool.tar.gz"
# sha256 = "<64 lowercase hex characters>"
# into = "/tmp/tool.tar.gz"   # /tmp, and nowhere else: it is a tmpfs, so
#                             # the finished image never carries the file

[agent]
run = "claude"

[access]
# Baseline is empty: this workspace and nothing else. Every grant here is
# a host path the agent can read — add one only when you mean it.
grants = ["~/.claude/.credentials.json"]
dns = "1.1.1.1"
# Add what the host trusts to what the box trusts. On a network that
# intercepts TLS with its own CA — Cloudflare WARP, a corporate proxy — a
# fresh store rightly refuses it. This mounts the host's bundle and points
# every TLS client at it: most do not read one unless told to, and Node,
# which the agent is, never reads one at all. The build box gets it too.
#
# Adds rather than replaces: the image's own roots keep working. What the
# recipe can pin belongs in `[[image.artifact]]`, which needs no trust.
host_ca = true

[env.TERM]
default = "xterm-256color"

[env.SHELL]
fixed = "/bin/bash"
