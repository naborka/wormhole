# Written by `wormhole init`. The whole recipe for this workspace's box.
# Every key: https://naborka.github.io/wormhole/guide/manifest.html

version = 1

# Change anything here and the next start rebuilds the image.
[image]
base = "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.2-x86_64.tar.gz"
base_sha256 = "412454ed98025ad9cd910d13f3d448b184e81502baa83180e89f98d0f13674be"
package_sources = [
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/main",
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/community",
]
packages = ["bash", "nodejs", "npm", "git", "ca-certificates"]
# Shell lines, run as root while the image is built.
build = ["npm install -g @anthropic-ai/claude-code"]

# A file the build would otherwise fetch: wormhole fetches it on the host,
# checks the digest, and binds it read-only under /tmp. Put these tables
# after every plain [image] key.
#
# [[image.artifact]]
# url = "https://example.test/tool.tar.gz"
# sha256 = "<64 lowercase hex characters>"
# into = "/tmp/tool.tar.gz"

[agent]
run = "claude"

# The box is on the host's network. Everything else of yours is opt-in.
[access]
# Host paths the agent may read and write.
# grants = ["~/some/path"]
# Leave out to use the host's own resolver.
dns = "1.1.1.1"
# "none": /login in the box. "copy": your login, copied in once.
# "share": your login file, bound read-write.
# credentials = "none"
# Trust the host's CA bundle too, for networks that intercept TLS.
host_ca = true

# A variable reaches the box only when declared here or by --env.
# `default`: host's value wins when it has one. `fixed`: never overridden.
# `ask = true`: asked once, kept for every box, and masked.
[env.SHELL]
fixed = "/bin/bash"
