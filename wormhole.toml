# The box for this workspace: `wormhole build` makes the image once,
# `wormhole box` runs the agent in it.

version = 1

[image]
base = "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.2-x86_64.tar.gz"
base_sha256 = "412454ed98025ad9cd910d13f3d448b184e81502baa83180e89f98d0f13674be"

# http on purpose: a fresh rootfs has no CA store; apk verifies signatures.
package_sources = [
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/main",
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/community",
]

packages = [
  "bash",
  "nodejs",
  "npm",
  "git",
  "openssh-client",
  "ca-certificates",
  "ripgrep",
  "fd",
  "eza",
  "btop",
  "ncdu",
]

# `--offline` proves both artifacts below are all npm needs.
build = ["npm install -g --offline /tmp/claude-code.tgz /tmp/claude-code-musl.tgz"]

# Claude Code, pinned. The musl package is an optional dependency npm
# would otherwise fetch.
[[image.artifact]]
url = "https://registry.npmjs.org/@anthropic-ai/claude-code/-/claude-code-2.1.246.tgz"
sha256 = "8243db25322e7295953455aee463324bfa229f37184fcf2adf90446818803dce"
into = "/tmp/claude-code.tgz"

[[image.artifact]]
url = "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64-musl/-/claude-code-linux-x64-musl-2.1.246.tgz"
sha256 = "d5214cfc4d4e8d0028bb9d754eb524391d1a4b54386365f36c2f29a8322fc780"
into = "/tmp/claude-code-musl.tgz"

[agent]
run = "claude"
model = "claude-sonnet-4-6"

[access]
dns = "1.1.1.1"
credentials = "none"

# Claude Code dies without one, and it must exist in the box.
[env.SHELL]
fixed = "/bin/bash"
