[package]
name = "wormhole-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Purity rule: no OS, no I/O, no async. Enforced by the `purity` test
# in src/lib.rs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] }
unicode-width = "0.2.2"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
