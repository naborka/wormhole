[package]
name = "wormhole"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wormhole-core = { path = "../wormhole-core" }
nix = { version = "0.30", features = ["sched", "mount", "user", "fs", "hostname", "process", "signal", "term"] }
tempfile = "3"
sha2 = "0.10"
landlock = "0.4.7"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
seccompiler = "0.5.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[dev-dependencies]
# `term` and `ioctl` are for the panel tests only: they drive the panel on
# a real pty, which is the only place a stray write to the terminal can be
# seen and the only way to resize the surface it is drawn on.
nix = { version = "0.30", features = ["term", "ioctl"] }

[features]
# Integration tests that need a real kernel with unprivileged userns.
kernel-tests = []

[lints]
workspace = true
