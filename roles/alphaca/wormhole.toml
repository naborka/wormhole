# Alphaca: the chief-staff-engineer role, boxed.
#
#   ln -s "$(pwd)/roles/alphaca" ~/.config/wormhole/roles/alphaca
#   wormhole box --role alphaca            # pick which CLI
#   wormhole box --role alphaca --run grok # skip the pick
#
# One role, one image. Each CLI is its own box, and that box follows you
# from project to project. Claude plugins have no grok/codex analogue;
# the preflight skips them there.

version = 1
name = "Alphaca"

[image]
base = "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.2-x86_64.tar.gz"
base_sha256 = "412454ed98025ad9cd910d13f3d448b184e81502baa83180e89f98d0f13674be"

# http on purpose: a fresh rootfs has no CA store; apk verifies signatures.
package_sources = [
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/main",
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/community",
]

packages = [
  "bash",
  "nodejs",
  "npm",
  "git",
  "curl",
  "github-cli",
  "openssh-client",
  "ca-certificates",
  "build-base",
  "ripgrep",
  "fd",
  "eza",
  "btop",
  "ncdu",
  "zstd",
]

# The product binary and rtk are not in the image: the preflight hook
# keeps the latest of both in the box home's ~/.local/bin. zstd is here
# because grok's installer prefers the zstd build; the others ignore it.
build = [
  # rustup-init reads its own argv[0], so it keeps its name.
  "mkdir -p /tmp/rustup && cp /tmp/rustup-init /tmp/rustup/ && chmod +x /tmp/rustup/rustup-init",
  "RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo /tmp/rustup/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.97.1 -c rustfmt -c clippy -c rust-analyzer",
  "ln -s /usr/local/cargo/bin/* /usr/local/bin/",
]

# Rust from rustup, not apk: Alpine 3.22 pins rustc 1.87 for good.
[[image.artifact]]
url = "https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-musl/rustup-init"
sha256 = "9cd3fda5fd293890e36ab271af6a786ee22084b5f6c2b83fd8323cec6f0992c1"
into = "/tmp/rustup-init"

[agent]
run = ["claude", "codex", "grok"]
instructions = "ROLE.md"
preflight = "hooks/preflight.sh"
# One box per CLI for every project: the login and the setup are made
# once. Every project's history is then in reach of every other.
resume = "anywhere"

[access]
dns = "1.1.1.1"
credentials = "none"
# rustup fetches the toolchain over TLS; on an intercepting network only
# the host's CA bundle makes that work.
host_ca = true

grants = ["~/.ssh"]

# CARGO_HOME stays unset: ~/.cargo is in the kept home, so the registry
# survives between boxes.
[env.RUSTUP_HOME]
fixed = "/usr/local/rustup"

[env.CAVEMAN_DEFAULT_MODE]
fixed = "ultra"

[env.CONTEXT7_API_KEY]
ask = true

# A fine-grained token, read-only unless you mean it: the agent can read
# it, and its scope is the blast radius. Empty skips; gh then reads
# public GitHub only.
[env.GITHUB_TOKEN]
ask = true

# Empty: a host that exports one can hand it over. ChatGPT sign-in
# needs no key; a set one switches codex to usage-based billing.
[env.OPENAI_API_KEY]
default = ""

# Empty: a box signs in with `grok login`. Declared so a host that has a
# key can hand it over, and so nothing else can.
[env.XAI_API_KEY]
default = ""

# The agent hands it to hooks and commands, and it must exist in the box.
[env.SHELL]
fixed = "/bin/bash"
