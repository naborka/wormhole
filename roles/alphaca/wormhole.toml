# Alphaca: the chief-staff-engineer role, boxed.
#
#   ln -s "$(pwd)/roles/alphaca" ~/.config/wormhole/roles/alphaca
#   wormhole box --role alphaca            # pick which CLI
#   wormhole box --role alphaca --run grok # skip the pick
#
# One role, one image. Each CLI is its own box, and that box follows you
# from project to project. Claude plugins have no grok/codex analogue;
# the preflight skips them there.

version = 1
name = "Alphaca"

[image]
base = "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.2-x86_64.tar.gz"
base_sha256 = "412454ed98025ad9cd910d13f3d448b184e81502baa83180e89f98d0f13674be"

# http on purpose: a fresh rootfs has no CA store; apk verifies signatures.
package_sources = [
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/main",
  "http://dl-cdn.alpinelinux.org/alpine/v3.22/community",
]

packages = [
  "bash",
  "nodejs",
  "npm",
  "git",
  "curl",
  "github-cli",
  "openssh-client",
  "ca-certificates",
  "build-base",

  # GNU, not BusyBox. Agents write GNU flags and rtk passes `--null` to
  # grep; BusyBox refuses both. Measured in docs/research/box-tools.md.
  "grep",
  "findutils",
  "sed",
  "coreutils",
  "diffutils",
  "gawk",
  "tree",
  "tar",
  # Zoneinfo: without it TZ names fall back to UTC and PostgreSQL refuses them.
  "tzdata",
  # Skills ship python scripts.
  "python3",
  # JavaScript build; a packageManager pin switches to the same kind.
  "pnpm",
  # Disposable test database; rules/box.md says how.
  "postgresql17",
  "postgresql-pgvector",

  # procps, not BusyBox: codex's app-server records its child with
  # `ps -p <pid> -o stat= -o lstart=` and codex dies at start when ps
  # refuses it. BusyBox ps has neither flag.
  "procps-ng",

  "jq",
  "ripgrep",
  "fd",
  "eza",
  "ast-grep",
  "hyperfine",
  # Linker. Relink after an edit drops from 2.3 s to 1.0 s.
  "mold",
  # Gates on this repository's own shell and prose.
  "shellcheck",
  "typos",
  # For a person in `wormhole attach`; the agent is not sent to them.
  "btop",
  "ncdu",
  "zstd",
]

# The product and rtk are not in the image: the preflight hook keeps the
# latest of both in the box home, on its ~/.local/bin. zstd is here
# because grok's installer prefers the zstd build; the others ignore it.
build = [
  # rustup-init reads its own argv[0], so it keeps its name.
  "mkdir -p /tmp/rustup && cp /tmp/rustup-init /tmp/rustup/ && chmod +x /tmp/rustup/rustup-init",
  "RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo /tmp/rustup/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.97.1 -c rustfmt -c clippy -c rust-analyzer",
  "ln -s /usr/local/cargo/bin/* /usr/local/bin/",
  "tar -xzf /tmp/cargo-nextest.tar.gz -C /usr/local/bin cargo-nextest",
  # Alpine keeps postgres under /usr/libexec with nothing on PATH.
  "for f in /usr/libexec/postgresql17/*; do [ -x \"$f\" ] || continue; ln -sf \"$f\" /usr/local/bin/; done",
  # A cc that links with mold; CARGO_TARGET_*_LINKER below points at it.
  "printf '#!/bin/sh\\nexec cc -fuse-ld=mold \"$@\"\\n' > /usr/local/bin/cc-mold && chmod 0755 /usr/local/bin/cc-mold",
]

# Rust from rustup, not apk: Alpine 3.22 pins rustc 1.87 for good.
[[image.artifact]]
url = "https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-musl/rustup-init"
sha256 = "9cd3fda5fd293890e36ab271af6a786ee22084b5f6c2b83fd8323cec6f0992c1"
into = "/tmp/rustup-init"

# A prebuilt musl binary, not the apk package: that one depends on Alpine's
# own cargo and would install rustc 1.87 beside the rustup toolchain.
[[image.artifact]]
url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-linux-musl.tar.gz"
sha256 = "6d891c18105ec2d33f6e441a4f92b7ccab47ba263e22055c8bb66884243f3389"
into = "/tmp/cargo-nextest.tar.gz"

[agent]
run = ["claude", "codex", "grok"]
instructions = "ROLE.md"
preflight = "hooks/preflight.sh"
rules = "rules"
# One box per CLI for every project: the login and the setup are made
# once. Every project's history is then in reach of every other.
resume = "anywhere"

[access]
dns = "1.1.1.1"
credentials = "none"
# rustup fetches the toolchain over TLS; on an intercepting network only
# the host's CA bundle makes that work.
host_ca = true

grants = ["~/.ssh"]

# CARGO_HOME stays unset: ~/.cargo is in the kept home, so the registry
# survives between boxes.
[env.RUSTUP_HOME]
fixed = "/usr/local/rustup"

# The linker is part of cargo's fingerprint: changing it rebuilds the
# tree, so it is fixed here and never toggled per session.
[env.CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER]
fixed = "/usr/local/bin/cc-mold"

# nextest otherwise prints one line per passing test: 59 KB for this
# repository's suite, 510 bytes with these two.
[env.NEXTEST_STATUS_LEVEL]
fixed = "fail"

[env.NEXTEST_FINAL_STATUS_LEVEL]
fixed = "fail"

[env.CAVEMAN_DEFAULT_MODE]
fixed = "ultra"

[env.CONTEXT7_API_KEY]
ask = true

# A fine-grained token, read-only unless you mean it: the agent can read
# it, and its scope is the blast radius. Empty skips; gh then reads
# public GitHub only.
[env.GITHUB_TOKEN]
ask = true

# Empty: a host that exports one can hand it over. ChatGPT sign-in
# needs no key; a set one switches codex to usage-based billing.
[env.OPENAI_API_KEY]
default = ""

# Empty: a box signs in with `grok login`. Declared so a host that has a
# key can hand it over, and so nothing else can.
[env.XAI_API_KEY]
default = ""

# The agent hands it to hooks and commands, and it must exist in the box.
[env.SHELL]
fixed = "/bin/bash"

# Alpine cannot run Playwright's browsers. A host `npx playwright run-server`
# can serve the box; its ws:// address crosses here, empty otherwise.
[env.PW_TEST_CONNECT_WS_ENDPOINT]
default = ""
